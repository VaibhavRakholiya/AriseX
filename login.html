<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AriseX — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8b5cf6">
    <script>
        (function() {
            const theme = localStorage.getItem('flowboard-theme') ||
                (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <main class="login-page">
        <!-- Branding panel -->
        <section class="login-branding" aria-label="About AriseX">
            <div class="login-brand-logo" aria-hidden="true">
                <i class="fa-solid fa-diagram-project"></i>
            </div>
            <p class="login-brand-name">AriseX</p>
            <p class="login-brand-tagline">Plan the work. Track the hours. Ship the thing.</p>

            <ul class="login-features">
                <li class="login-feature-item">
                    <span class="login-feature-icon" aria-hidden="true"><i class="fa-solid fa-list-check"></i></span>
                    <span>Task lists with custom workflows</span>
                </li>
                <li class="login-feature-item">
                    <span class="login-feature-icon" aria-hidden="true"><i class="fa-solid fa-robot"></i></span>
                    <span>Agent workflows for automated tasks</span>
                </li>
                <li class="login-feature-item">
                    <span class="login-feature-icon" aria-hidden="true"><i class="fa-solid fa-clock"></i></span>
                    <span>Built-in time tracking &amp; reports</span>
                </li>
            </ul>
        </section>

        <!-- Form panel -->
        <section class="login-form-panel" aria-labelledby="loginHeading">
            <!-- Theme toggle -->
            <button class="login-theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle colour theme">
                <i class="fa-solid fa-moon" id="themeIcon" aria-hidden="true"></i>
            </button>

            <div class="login-form-card">
            <h1 class="login-form-title" id="loginHeading">Welcome back</h1>
            <p class="login-form-subtitle">Sign in to your AriseX workspace.</p>

            <form class="login-form" id="loginForm" autocomplete="off">
                <div class="login-form-group">
                    <label class="login-form-label" for="username">Email</label>
                    <input
                        class="login-form-input"
                        type="email"
                        id="username"
                        name="username"
                        placeholder="Enter your email"
                        autocomplete="username"
                        required
                    />
                </div>

                <div class="login-form-group">
                    <label class="login-form-label" for="password">Password</label>
                    <div class="login-input-wrap">
                        <input
                            class="login-form-input login-form-input--password"
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        />
                        <button
                            type="button"
                            id="togglePassword"
                            class="login-password-toggle"
                            title="Show password"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <i class="fa-solid fa-eye" id="eyeIcon" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div class="login-error" id="loginError" role="alert">
                    <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
                    <span id="loginErrorText">Invalid username or password. Please try again.</span>
                </div>

                <button type="submit" class="login-submit" id="loginBtn">
                    <span id="loginBtnText">Sign In</span>
                    <span id="loginSpinner" class="is-hidden">
                        <span class="spinner spinner--sm"></span>
                    </span>
                </button>
            </form>
            </div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        // ── Theme toggle ──────────────────────────────────────
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon   = document.getElementById('themeIcon');

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('flowboard-theme', theme);
            themeIcon.className = theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        });

        // Set correct icon on load
        const initialTheme = document.documentElement.getAttribute('data-theme') || 'dark';
        themeIcon.className = initialTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';

        // ── Password visibility toggle ────────────────────────
        const passwordInput  = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const eyeIcon        = document.getElementById('eyeIcon');

        togglePassword.addEventListener('click', () => {
            const willShow = passwordInput.type === 'password';
            passwordInput.type = willShow ? 'text' : 'password';
            eyeIcon.className  = willShow ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
            togglePassword.setAttribute('aria-pressed', String(willShow));
            const label = willShow ? 'Hide password' : 'Show password';
            togglePassword.setAttribute('aria-label', label);
            togglePassword.title = label;
        });

        // ── Login form ────────────────────────────────────────
        const loginForm    = document.getElementById('loginForm');
        const loginError   = document.getElementById('loginError');
        const loginBtn     = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        const loginSpinner = document.getElementById('loginSpinner');
        const errorText    = document.getElementById('loginErrorText');

        // Real Firebase Authentication (TASK-584) — supersedes the
        // RTDB-stored-hash check from TASK-581. Firebase's own Identity
        // Platform validates the password and issues the session; nothing
        // here ever sees or stores a password. Sign-in is by email, which is
        // what Firebase Auth's email/password provider requires — display
        // names below are just for what greets the user in the sidebar.
        const DISPLAY_NAMES = {
            'rakholiyavaibhav@gmail.com': 'Vaibhav',
            'aksidhhapura410@gmail.com':  'Aakash',
        };

        function displayNameFor(email) {
            return DISPLAY_NAMES[email.toLowerCase()] || email.split('@')[0];
        }

        function authErrorMessage(err) {
            switch (err.code) {
                case 'auth/invalid-email':
                case 'auth/user-not-found':
                case 'auth/wrong-password':
                case 'auth/invalid-credential':
                    return 'Invalid email or password. Please try again.';
                case 'auth/too-many-requests':
                    return 'Too many attempts. Please wait a moment and try again.';
                case 'auth/network-request-failed':
                    return 'Could not reach the server. Check your connection and try again.';
                default:
                    return 'Something went wrong signing you in. Please try again.';
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.classList.remove('visible');

            const email    = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                errorText.textContent = 'Please fill in all fields.';
                loginError.classList.add('visible');
                return;
            }

            // Show spinner
            loginBtnText.style.display = 'none';
            loginSpinner.classList.remove('is-hidden');
            loginBtn.disabled = true;

            try {
                await window.firebaseAuth.signInWithEmailAndPassword(email, password);
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('username', displayNameFor(email));
                localStorage.setItem('loginTime', new Date().toISOString());
                window.location.href = 'index.html';
            } catch (err) {
                console.error('Login: Firebase sign-in failed', err);
                loginBtnText.style.display = 'inline';
                loginSpinner.classList.add('is-hidden');
                loginBtn.disabled = false;
                errorText.textContent = authErrorMessage(err);
                loginError.classList.add('visible');
                document.getElementById('username').classList.add('error');
                document.getElementById('password').classList.add('error');
                document.getElementById('username').addEventListener('input', () => {
                    document.getElementById('username').classList.remove('error');
                    document.getElementById('password').classList.remove('error');
                }, { once: true });
            }
        });

        // ── Redirect if already logged in ─────────────────────
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = 'index.html';
        }

        // ── Service Worker registration ───────────────────────
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
    </script>
</body>
</html>
